name: estado

on:
  schedule:
    - cron: "*/5 * * * *"        # best effort, GitHub often runs it every 6 to 10 min
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estado-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll sources and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMT_EMAIL: ${{ secrets.EMT_EMAIL }}
          EMT_PASSWORD: ${{ secrets.EMT_PASSWORD }}
          ESTADO_OUT: estado.json
        run: python3 -I publish.py
      - name: Keep the last result as an artifact (handy for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: estado-${{ github.run_id }}
          path: estado.json
          retention-days: 2
