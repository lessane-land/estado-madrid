name: probe-511
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Shapes only (the token is never printed)
        env:
          K: ${{ secrets.SF511_TOKEN }}
        run: |
          pip -q install gtfs-realtime-bindings
          python3 - <<'PY'
          import os, urllib.request, json, time
          from google.transit import gtfs_realtime_pb2
          K = os.environ["K"]
          def get(path):
              try:
                  with urllib.request.urlopen(f"https://api.511.org/{path}&api_key={K}", timeout=60) as r:
                      return r.status, r.read()
              except Exception as e:
                  return getattr(e, "code", type(e).__name__), b""
          st, b = get("toll/programs?format=json")
          d = json.loads(b.decode("utf-8-sig"))
          progs = d["toll-programs"]; print("programs", len(progs))
          p0 = next(p for p in progs if p.get("toll-signs"))
          print("PROGRAM", json.dumps({k: v for k, v in p0.items() if k != "toll-signs"})[:900])
          print("SIGN", json.dumps(p0["toll-signs"][0])[:1500])
          print("NAMES", [p["toll-authority-info"]["toll-program-name"] for p in progs][:40])
          time.sleep(2)
          st, b = get("traffic/wzdx?format=json")
          d = json.loads(b.decode("utf-8-sig"))
          f = d["features"]; print("features", len(f))
          import collections
          print("types", collections.Counter(x["properties"]["core_details"].get("event_type") for x in f))
          print("impact", collections.Counter(x["properties"].get("vehicle_impact") for x in f))
          print("geom", collections.Counter(x["geometry"]["type"] for x in f))
          print("FEATURE", json.dumps(f[0])[:1500])
          PY
